<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register your BNB</title>
  <link rel="stylesheet" href="/output.css">
</head>
<body class="min-h-screen bg-stone-50 text-stone-800">
  <header class="border-b border-stone-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a href="/" class="text-2xl font-bold tracking-tight text-airbnb">Mybnb</a>
      <div class="flex gap-3">
        <a href="/user/rent" class="rounded-full px-4 py-2 text-sm font-medium text-stone-700 hover:bg-stone-100">Rent</a>
        <a href="/host/add-bnb" class="rounded-full bg-airbnb px-4 py-2 text-sm font-semibold text-white">Host</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-md px-6 py-16">
    <h1 class="mb-2 text-3xl font-bold text-stone-900">Register your BNB</h1>
    <p class="mb-8 text-stone-600">Add a house name to list it for guests.</p>
    <form action="/host/submit" method="post" class="rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
      <label for="housename" class="mb-2 block text-sm font-medium text-stone-700">House name</label>
      <input
        id="housename"
        name="housename"
        type="text"
        placeholder="Enter the house name"
        class="mb-5 w-full rounded-xl border border-stone-300 px-4 py-3 outline-none focus:border-airbnb focus:ring-2 focus:ring-rose-200"
      >
      <input
        id="price"
        name="price"
        type="number"
        placeholder="Enter the house price/per night"
        class="mb-5 w-full rounded-xl border border-stone-300 px-4 py-3 outline-none focus:border-airbnb focus:ring-2 focus:ring-rose-200"
      >
      <input
        id="location"
        name="location"
        type="text"
        placeholder="Enter the house location"
        class="mb-5 w-full rounded-xl border border-stone-300 px-4 py-3 outline-none focus:border-airbnb focus:ring-2 focus:ring-rose-200"
      >
      Add an Image
      <input type="file" name="preview-image" id="imageInput" accept="image/*" class="mb-3" placeholder="Add an preview Image">
      <input
        type="submit"
        value="Submit"
        class="w-full cursor-pointer rounded-full bg-airbnb py-3 font-semibold text-white hover:bg-rose-600"
      >
    </form>
  </main>
</body>
</html>
