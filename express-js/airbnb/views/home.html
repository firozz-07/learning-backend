<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My BNB</title>
  <link rel="stylesheet" href="/output.css">
</head>
<body class="min-h-screen bg-stone-50 text-stone-800">
  <header class="border-b border-stone-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a href="/" class="text-2xl font-bold tracking-tight text-airbnb">Mybnb</a>
      <div class="flex gap-3">
        <a href="/user/rent" class="rounded-full px-4 py-2 text-sm font-medium text-stone-700 hover:bg-stone-100">Rent</a>
        <a href="/host/add-bnb" class="rounded-full bg-airbnb px-4 py-2 text-sm font-semibold text-white hover:bg-rose-600">Host</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-5xl px-6 py-20 text-center">
    <p class="mb-3 text-sm font-semibold uppercase tracking-widest text-airbnb">Stay anywhere</p>
    <h1 class="mb-4 text-5xl font-bold tracking-tight text-stone-900">Welcome to Mybnb</h1>
    <p class="mx-auto mb-10 max-w-xl text-lg text-stone-600">Find a place to stay, or list your home for guests around the world.</p>
    <div class="flex flex-wrap items-center justify-center gap-4">
      <a href="/host/add-bnb" class="rounded-full bg-airbnb px-8 py-3 font-semibold text-white shadow-sm hover:bg-rose-600">Register a BNB</a>
      <a href="/user/rent" class="rounded-full border border-stone-300 bg-white px-8 py-3 font-semibold text-stone-800 hover:border-stone-400">Browse stays</a>
    </div>
  </main>
</body>
</html>
